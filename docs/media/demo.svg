<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <style>
    text { font-size: 13px; white-space: pre; }
    .p { fill: #7ee787; }
    .c { fill: #e6edf3; }
    .o { fill: #8b949e; }
    .g { fill: #56d364; }
    .a { fill: #e3b341; }
    .b { fill: #79c0ff; }
    .t { fill: #8b949e; font-size: 12px; }
    @keyframes k1  { 0%,3.3%  { opacity:0 } 4.8%,96%  { opacity:1 } 100% { opacity:0 } }
    @keyframes k2  { 0%,8%    { opacity:0 } 9.5%,96%  { opacity:1 } 100% { opacity:0 } }
    @keyframes k3  { 0%,12%   { opacity:0 } 13.5%,96% { opacity:1 } 100% { opacity:0 } }
    @keyframes k4  { 0%,16.7% { opacity:0 } 18.2%,96% { opacity:1 } 100% { opacity:0 } }
    @keyframes k5  { 0%,20.7% { opacity:0 } 22.2%,96% { opacity:1 } 100% { opacity:0 } }
    @keyframes k6  { 0%,25.3% { opacity:0 } 26.8%,96% { opacity:1 } 100% { opacity:0 } }
    @keyframes k7  { 0%,30%   { opacity:0 } 31.5%,96% { opacity:1 } 100% { opacity:0 } }
    @keyframes k8  { 0%,35.3% { opacity:0 } 36.8%,96% { opacity:1 } 100% { opacity:0 } }
    @keyframes k9  { 0%,43.3% { opacity:0 } 44.8%,96% { opacity:1 } 100% { opacity:0 } }
    @keyframes k10 { 0%,51.7% { opacity:0 } 53.2%,96% { opacity:1 } 100% { opacity:0 } }
    @keyframes k11 { 0%,60%   { opacity:0 } 61.5%,96% { opacity:1 } 100% { opacity:0 } }
    @keyframes k12 { 0%,68.3% { opacity:0 } 69.8%,96% { opacity:1 } 100% { opacity:0 } }
    @keyframes k13 { 0%,75%   { opacity:0 } 76.5%,96% { opacity:1 } 100% { opacity:0 } }
    @keyframes k14 { 0%,83.3% { opacity:0 } 84.8%,96% { opacity:1 } 100% { opacity:0 } }
    .l1  { animation: k1  30s linear infinite; opacity:0 }
    .l2  { animation: k2  30s linear infinite; opacity:0 }
    .l3  { animation: k3  30s linear infinite; opacity:0 }
    .l4  { animation: k4  30s linear infinite; opacity:0 }
    .l5  { animation: k5  30s linear infinite; opacity:0 }
    .l6  { animation: k6  30s linear infinite; opacity:0 }
    .l7  { animation: k7  30s linear infinite; opacity:0 }
    .l8  { animation: k8  30s linear infinite; opacity:0 }
    .l9  { animation: k9  30s linear infinite; opacity:0 }
    .l10 { animation: k10 30s linear infinite; opacity:0 }
    .l11 { animation: k11 30s linear infinite; opacity:0 }
    .l12 { animation: k12 30s linear infinite; opacity:0 }
    .l13 { animation: k13 30s linear infinite; opacity:0 }
    .l14 { animation: k14 30s linear infinite; opacity:0 }
    @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
    .cursor { animation: blink 1.2s steps(1) infinite; fill:#7ee787 }
  </style>

  <rect x="0.5" y="0.5" width="759" height="447" rx="12" fill="#0d1117" stroke="#30363d"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="22" r="6" fill="#febc2e"/>
  <circle cx="64" cy="22" r="6" fill="#28c840"/>
  <text x="380" y="26" text-anchor="middle" class="t">standing·orders — the unattended stretch</text>
  <line x1="0" y1="40" x2="760" y2="40" stroke="#21262d"/>

  <g class="l1"><text x="28" y="68"><tspan class="p">$ </tspan><tspan class="c">standing-orders task add "migrate the payouts schema" --id schema</tspan></text></g>
  <g class="l2"><text x="28" y="92" class="o">  queued   schema</text></g>
  <g class="l3"><text x="28" y="116"><tspan class="p">$ </tspan><tspan class="c">standing-orders task add "wire the payouts API" --id api</tspan></text></g>
  <g class="l4"><text x="28" y="140" class="o">  queued   api</text></g>
  <g class="l5"><text x="28" y="164"><tspan class="p">$ </tspan><tspan class="c">standing-orders task block api --on schema</tspan></text></g>
  <g class="l6"><text x="28" y="188" class="o">  held     api — waits for schema</text></g>
  <g class="l7"><text x="28" y="212"><tspan class="p">$ </tspan><tspan class="c">standing-orders daemon install --runner builder-1 --repo ~/code/payouts</tspan></text></g>
  <g class="l8"><text x="28" y="236" class="o">  watching — wakes on events, spends nothing while idle</text></g>

  <g class="l9"><text x="380" y="272" text-anchor="middle" class="o">·  ·  ·   you leave   ·  ·  ·</text></g>

  <g class="l10"><text x="28" y="308"><tspan class="a">?  schema</tspan><tspan class="o"> parked a decision — </tspan><tspan class="c">"expand-and-contract, or hard cutover?"</tspan></text></g>
  <g class="l11"><text x="28" y="332"><tspan class="b">✓ answered from your phone</tspan><tspan class="o"> — hold lifted, the build resumes in seconds</tspan></text></g>
  <g class="l12"><text x="28" y="360"><tspan class="g">✓ schema</tspan><tspan class="o">   branch pushed · </tspan><tspan class="c">PR #112 opened</tspan></text></g>
  <g class="l13"><text x="28" y="384"><tspan class="g">✓ api</tspan><tspan class="o">      unblocked · built · </tspan><tspan class="c">PR #113 opened</tspan></text></g>
  <g class="l14"><text x="28" y="416"><tspan class="o">0 tokens spent while idle · </tspan><tspan class="c">one interruption, two pull requests</tspan><tspan class="cursor"> ▍</tspan></text></g>
</svg>
