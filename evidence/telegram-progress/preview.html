<!doctype html><meta name="viewport" content="width=device-width, initial-scale=1"><title>Telegram progress preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#f0f3f6;font:17px/1.45 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:760px;margin:auto;padding:24px 18px}h1{font-size:21px;margin:0 0 5px}header p{margin:0;color:#adbccc;font-size:14px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}button{background:#23384a;color:#eff7ff;border:1px solid #466179;border-radius:10px;min-height:44px;padding:8px 14px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#246997}button:focus-visible,a:focus-visible{outline:3px solid #ffcf75;outline-offset:3px}.bubble{background:#263b4d;border-radius:16px;padding:17px 18px;max-width:520px;box-shadow:0 1px 3px #0004}.text{white-space:pre-wrap;overflow-wrap:anywhere}.text::first-line{font-weight:650}.action{display:flex;align-items:center;justify-content:center;min-height:48px;margin-top:12px;background:#335775;border-radius:9px;color:#fff;text-decoration:none;font-weight:600}.state{font-size:13px;color:#adbccc;margin-top:24px}footer{color:#aebdcb;font-size:14px;margin-top:25px;max-width:520px}@media(min-width:800px){main{padding-top:50px}}
</style><main><header><h1>One task, one progress message</h1><p>Telegram message preview · synthetic examples</p></header><nav aria-label="Preview state"></nav><article class="bubble"><div class="text"></div><a class="action">Review result</a></article><footer>Routine updates replace this message. Decisions and acceptance evidence keep their own alerts.</footer></main>
<script>const cards=CARDS_JSON;const states={running:'Building',reviewing:'Reviewing',complete:'Review complete',ready:'Result saved',failedChecks:'Failed checks',missingProof:'No checks',long:'Long title',paused:'Stopped'};const nav=document.querySelector('nav');for(const[key,label]of Object.entries(states)){const button=document.createElement('button');button.textContent=label;button.onclick=()=>show(key);button.dataset.key=key;nav.append(button)}function show(key){const card=cards[key];document.querySelector('.text').textContent=card.text;const link=document.querySelector('.action');link.textContent=card.link.label;link.href='FIXTURE_URL'+card.link.path;for(const b of nav.children)b.setAttribute('aria-pressed',b.dataset.key===key?'true':'false')}show('reviewing');</script>
